title: "莫斯科大学中国留学生课堂身披旭日旗事件"
aliases: ["莫大精日学生事件", "莫斯科大学旭日旗事件", "陈某某披旭日旗事件", "莫大留学生身披日本军旗事件"]
summary: "2026年10月14日，莫斯科国立大学历史系一名三年级中国留学生（陈某某，据报为南京籍）在课堂（亚非历史课）上身披日本军国主义象征'旭日旗'、摆放二战日军军帽，遭在场中国留学生抗议并在要求下录制道歉视频。事件经网络传播后引发广泛关注：10月16日该系中国留学生集体请愿，校方透露已启动遣返程序；10月17日莫斯科大学中国学生学者联谊会发布情况通报（校方已启动校内调查）；10月19日校方召开专题座谈会，表示将尽快公布开除决定；据了解该学生已被遣返。中国驻俄使馆教育处已收到学联汇报。钧正平、人民日报等发表评论。官方开除决定尚未正式公布。"
