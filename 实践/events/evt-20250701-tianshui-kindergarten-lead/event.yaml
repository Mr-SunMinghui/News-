summary: >-
  2025年，甘肃省天水市麦积区褐石培心幼儿园幼儿及教职员工出现血铅异常。
  省级调查通报称，涉案人员将含铅、不可食用颜料加入部分面点；医院与疾控检测
  流程也发现严重问题。2026年10月16日，兰州市中级人民法院对六名被告人一审
  宣判。本档案按公开来源持续跟进二审、受影响儿童长期健康及救济情况。
