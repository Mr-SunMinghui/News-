title: "国内《我的世界》第三方启动器关闭游戏本体下载功能"
aliases: ["PCL 2.99.0.0 关闭下载", "HMCL 中国大陆禁用游戏下载", "PCL CE 2.15.1 禁用安装", "我的世界启动器被封杀", "10·20 MC启动器下载关停事件", "Minecraft 第三方启动器关闭下载事件"]
summary: "2026年10月20日下午，Minecraft Java版第三方启动器PCL发布2.99.0.0，版本说明称“为遵守相关法律法规，PCL 不再提供 MC 下载功能”，作者另称“与网易微软麻将无关，中国式家长很神奇吧”。同日下午，HMCL合并PR #7017并在预览版3.17.0.362中按中国大陆地区限制版本/资源下载页面；晚间，PCL CE社区版2.15.1也禁用中国大陆地区的Minecraft本体、整合包下载、安装与补全。三款启动器均未公布移除本地启动能力，HMCL 与 PCL CE 明确保留已完整安装版本的启动；均未公布具体法律条款、监管机关、通知文书或恢复时间表。社区广泛流传“未成年玩家在私服充值后被家长举报、牵连启动器”的起因说法，但除作者暗示性措辞和二手转述外，缺少可核对的原始材料；MineBBS新闻版明确称未发现与某一具体服务器、资源或作者有关的迹象。事件同时引发“所有国内启动器被封禁”“网易中国版随之下架”“请勿启动旧版PCL”“恢复版启动器”等说法，需与已确认的功能调整分开记录。"
