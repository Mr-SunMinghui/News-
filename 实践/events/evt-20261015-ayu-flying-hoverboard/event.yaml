title: "B站UP主“神奇阿宇Ayu”自制载人飞行滑板及舆论争议"
aliases: ["神奇阿宇飞行滑板", "宋兴宇飞行滑板", "AYU FLYING HUB", "阿宇飞越长江", "湖北00后小伙手搓飞行滑板", "影石180万资助飞行滑板", "飞行滑板AI造假争议"]
summary: "2026年10月15日，B站UP主“神奇阿宇Ayu”（宋兴宇）发布《我造了一块会飞的滑板...》，记录其在湖北恩施巴东县巴人河景区等地驾驶自制电动飞行滑板的多次试飞。视频获新华网 B 站号等转发（标注来源央视新闻），出现“中国人能飞”等标题；随后网友就画面是否由AI生成/绿幕合成提出具体质疑，创作者以置顶评论否认并称不实指控为“造谣”。10月20日影石创新因2025年12月通过Think Bold基金资助阿宇180万元而被市场关注，股价收涨8.97%、市值增约34亿元，公司回应称资助属创作者扶持、非股权投资、不代表布局飞行滑板。事件同时涉及空域报备与安全合规、STEPX赞助与商业关系、第三方“碾压马斯克”式拉踩，以及“质疑者蹭流量/造谣”的反指。央广网两篇相关稿件文末标注“商业信息”，不属编辑部报道，不能作为官媒背书。载人飞行本身有多来源迹象支持，但“全片无AI/合成”“已获批准”“股价上涨由该视频导致”等说法仍存争议或证据不足。"
