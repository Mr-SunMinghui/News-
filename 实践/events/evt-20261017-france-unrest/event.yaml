title: "法国2026年10月17日示威及多地骚乱"
aliases: ["法国骚乱", "2026年10月17日法国抗议冲突", "法国10月17日动员"]
summary: "2026年10月17日法国多地举行反生活成本上涨、声援学生诉求的集会，多地演变为警民冲突、纵火和商铺遭破坏/抢掠。10-18至10-19：官方统计连续上修（内政部口径近2,400人被捕、近千名军警受伤）；马克龙发表全国讲话；内政部长请辞被拒并承认部分城市'失去控制'；多起重伤案由IGPN/IGGN调查；议会拟议调查委员会；CGT等预告11月5日跨行业动员。10-19晚起：政府实施局部宵禁（巴黎共和广场/Les Halles、里尔等北部四城、尼斯、马赛禁令）并宣布'大规模司法行动'；司法部长称周末2,513人被拘留、67人监禁；卢浮宫因学生封锁全日关闭；商铺损失口径2,000—3,000家、'数亿欧元'；法国国债收益率与股市大跌（OAT-Bund利差约145—146bp）；马克龙赴海湾四国推动能源供应；黄背心预告10-24'第二幕'。10-20预算第一部分表决与调查委员会提议结果待录。数字随口径/时点变化，最终统计与司法结论待核。"
