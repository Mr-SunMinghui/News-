title: "尊界V800刹车踏板支架断裂风波（含智界V9误传与复测）"
aliases: ["尊界V800刹车踏板断裂", "尊界踏板断裂", "鸿蒙智行刹车踏板事件", "智界V9刹车断裂（误传）", "华为系MPV踏板断裂", "尊界V800制动踏板争议"]
summary: "2026年10月8日，汽车垂媒懂车帝发布测试视频：其自购的三台全新尊界V800（江淮汽车与华为鸿蒙智行合作的百万级MPV）在封闭场地100km/h-0全力制动中，刹车踏板支架分别于第2~4次制动时断裂，断裂位置一致。视频引发『设计强度不足』质疑，江淮汽车当日跌停、市值蒸发超60亿元。车企称制动系统满足高于国标/行标验证、用户实际场景未断裂，并承诺11月起免费升级；10月11日第三方检测称1500N合格、加严至3000N未裂。10月15日工信部、中央网信办、市场监管总局成立联合调查组。同期懂车帝复测显示智界V9等同材质竞品未断，『智界V9刹车踩断3次』系误传。10月31日懂车帝复测智界V9爬坡（50%坡动力不足未通过）但制动未断。截至2026-11-02，三部门调查结果尚未公布，事件未结。重要事实澄清：物理断裂仅发生于尊界V800；用户原表述『智界刹车踏板断裂』经核验为事实偏差——智界（奇瑞/华为）的智界V9在实测中未断裂。"
